<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7a84b">
  <title>🍽️ 今日なに食べる？</title>
  <style>
    :root{
      --bg:#fff8ef;
      --card:#ffffff;
      --ink:#2c251f;
      --muted:#756a60;
      --line:#eadbc9;
      --accent:#f28b38;
      --accent2:#ffcf96;
      --good:#2f7d47;
      --bad:#b24b40;
      --soft:#fff2df;
      --chip:#f6eadc;
      --shadow:0 10px 28px rgba(95,59,30,.12);
      --radius:18px;
      --safe-bottom: env(safe-area-inset-bottom, 12px);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg,#fff8ef 0%,#fffaf4 45%,#ffffff 100%);
      color:var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size:15px;
      line-height:1.5;
      -webkit-text-size-adjust:100%;
    }
    button,input,select,textarea{font:inherit}
    button{touch-action:manipulation}
    .app{max-width:780px;margin:0 auto;padding:12px 12px calc(88px + var(--safe-bottom));}
    header{
      position:sticky;top:0;z-index:20;
      margin:0 -12px 10px;padding:10px 12px 8px;
      background:rgba(255,248,239,.92);
      backdrop-filter: blur(12px);
      border-bottom:1px solid rgba(234,219,201,.75);
    }
    .title{display:flex;align-items:center;justify-content:space-between;gap:8px}
    h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.02em}
    .sub{font-size:12px;color:var(--muted);margin-top:2px}
    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:var(--soft);border:1px solid var(--line);padding:5px 9px;font-size:12px;color:#60452e;white-space:nowrap}
    .tabs{
      position:fixed;left:0;right:0;bottom:0;z-index:30;
      display:grid;grid-template-columns:repeat(6,1fr);
      max-width:780px;margin:0 auto;
      padding:7px 6px calc(7px + var(--safe-bottom));
      background:rgba(255,255,255,.96);
      border-top:1px solid var(--line);
      box-shadow:0 -8px 24px rgba(72,42,20,.08);
      backdrop-filter: blur(12px);
    }
    .tab{
      border:0;background:transparent;color:var(--muted);
      padding:8px 2px;border-radius:14px;font-size:11px;
      display:flex;flex-direction:column;align-items:center;gap:2px;
    }
    .tab span:first-child{font-size:18px}
    .tab span:last-child{font-size:10px}
    .tab.active{background:#fff0dc;color:#9a4c12;font-weight:700}
    .section{margin:12px 0}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:14px;margin:12px 0;
    }
    .card.flat{box-shadow:none}
    h2{font-size:18px;margin:0 0 10px;font-weight:800}
    h3{font-size:16px;margin:0 0 8px;font-weight:800}
    .muted{color:var(--muted);font-size:13px}
    .small{font-size:12px;color:var(--muted)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .between{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    @media(max-width:420px){.grid2,.grid3{grid-template-columns:1fr}}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      display:inline-flex;align-items:center;gap:6px;
      border:1px solid var(--line);background:var(--chip);
      border-radius:999px;padding:8px 10px;font-size:13px;min-height:36px;
    }
    .chip input{accent-color:var(--accent)}
    .chip.on,.tag.on{background:#ffe1b8;border-color:#f4b36d;color:#783800;font-weight:700}
    .tag{
      display:inline-flex;border:1px solid var(--line);background:#fff8ef;border-radius:999px;
      padding:4px 8px;font-size:12px;color:#5f5147;gap:4px;align-items:center;
    }
    .tag.good{background:#ecf8ee;color:#246b39;border-color:#bde5c5}
    .tag.bad{background:#fff0ed;color:#96372e;border-color:#ffd1c9}
    .tag.hot{background:#fff1d8;color:#9b3b00;border-color:#ffd08e}
    .tag.blue{background:#eef6ff;color:#2b5b8d;border-color:#cfe4ff}
    .primary,.secondary,.danger,.ghost{
      border:0;border-radius:14px;padding:11px 13px;font-weight:800;
      min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
      text-decoration:none;
    }
    .primary{background:var(--accent);color:white;box-shadow:0 7px 16px rgba(242,139,56,.25)}
    .secondary{background:#fff1dd;color:#8a490d;border:1px solid #ffd6a2}
    .danger{background:#fff0ed;color:#a33b31;border:1px solid #ffc7bd}
    .ghost{background:#f6f0e9;color:#604f40;border:1px solid var(--line)}
    .block{width:100%}
    input[type="text"],input[type="number"],input[type="url"],select,textarea{
      width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;
      padding:11px 12px;color:var(--ink);outline:none;
    }
    textarea{min-height:88px;resize:vertical}
    label.label{display:block;font-weight:700;margin:10px 0 5px;font-size:13px}
    .ingredient-group{margin:10px 0}
    .ingredient-title{font-weight:800;font-size:13px;color:#614c39;margin:10px 0 6px}
    details.ingredient-group{border:1px solid var(--line);border-radius:15px;background:#fffdf9;overflow:hidden}
    details.ingredient-group summary{list-style:none;cursor:pointer;padding:10px 12px;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
    details.ingredient-group summary::-webkit-details-marker{display:none}
    details.ingredient-group summary::after{content:'開く';font-size:11px;color:var(--muted);font-weight:700}
    details.ingredient-group[open] summary::after{content:'閉じる'}
    .ingredient-body{padding:0 10px 10px}
    .selected-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .candidate{position:relative;overflow:hidden}
    .candidate::before{
      content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);
      border-radius:var(--radius) 0 0 var(--radius);
    }
    .score{font-size:12px;color:#8a5b2a;background:#fff3e1;border:1px solid #ffdcb0;border-radius:999px;padding:3px 7px}
    .reasons{margin:8px 0 0;padding-left:18px;color:#5b5148;font-size:13px}
    .reasons li{margin:2px 0}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .actions.three{grid-template-columns:1fr 1fr 1fr}
    @media(max-width:430px){.actions,.actions.three{grid-template-columns:1fr}}
    .empty{
      text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);
      border-radius:var(--radius);background:rgba(255,255,255,.55)
    }
    .notice{background:#fff4df;border:1px solid #ffd89f;color:#6c421c;border-radius:14px;padding:10px 12px;font-size:13px}
    .warn{background:#fff0ed;border:1px solid #ffd1c9;color:#87352d;border-radius:14px;padding:10px 12px;font-size:13px}
    .list{display:grid;gap:8px}
    .recipe-line{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:15px;padding:10px;background:#fff}
    .recipe-line.teppan{background:linear-gradient(90deg,#fff2d8 0%,#fffdf8 78%);border-color:#f0bd7a;box-shadow:0 5px 18px rgba(208,121,28,.13)}
    .recipe-line.teppan .name::before{content:'⭐ ';}
    .recipe-line.idea{background:#fffdf9;border-style:dashed;opacity:.92}
    .idea-notice{background:#f6f0e9;border:1px dashed #d9c8b8;color:#66584c;border-radius:14px;padding:10px 12px;font-size:13px}
    .form-note{font-size:12px;color:var(--muted);margin-top:5px}
    .recipe-line .name{font-weight:800}
    .recipe-line .meta{font-size:12px;color:var(--muted)}
    .mini-btn{border:1px solid var(--line);background:#fff7ed;color:#75502c;border-radius:999px;padding:7px 9px;font-size:12px;font-weight:700;white-space:nowrap}
    .shopping-item{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff}
    .shopping-item input{width:18px;height:18px;accent-color:var(--accent)}
    .shopping-item.done span{text-decoration:line-through;color:var(--muted)}
    dialog{
      width:min(720px,calc(100vw - 20px));max-height:88vh;border:0;border-radius:20px;padding:0;
      box-shadow:0 24px 80px rgba(48,28,12,.28);overflow:hidden;
    }
    dialog::backdrop{background:rgba(28,18,10,.42)}
    .modal-head{position:sticky;top:0;background:#fff8ef;border-bottom:1px solid var(--line);padding:13px;z-index:2}
    .modal-body{padding:14px;overflow:auto;max-height:calc(88vh - 62px)}
    .close{border:0;background:#f1e7dc;border-radius:999px;width:36px;height:36px;font-weight:900}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .stat{background:#fff7ed;border:1px solid var(--line);border-radius:15px;padding:10px;text-align:center}
    .stat b{display:block;font-size:18px}
    .hidden{display:none !important}
    .divider{height:1px;background:var(--line);margin:12px 0}
    .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f4eee8;border:1px solid #e3d5c7;border-radius:6px;padding:1px 5px}
    .site-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    @media(max-width:430px){.site-links{grid-template-columns:1fr}}
    .calendar-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
    .calendar-head div{text-align:center;font-size:11px;color:var(--muted);font-weight:800}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
    .calendar-day{min-height:70px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:5px;overflow:hidden}
    .calendar-day.empty-day{background:rgba(255,255,255,.35);border-style:dashed}
    .calendar-day.today{border-color:#f0a45d;box-shadow:inset 0 0 0 1px #f0a45d;background:#fff8ed}
    .calendar-num{font-size:12px;font-weight:800;color:#5d4a3a;margin-bottom:3px}
    .calendar-dish{display:block;font-size:10px;line-height:1.25;color:#5d4a3a;background:#fff1dd;border-radius:7px;padding:2px 4px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .history-card{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:15px;background:#fff;padding:10px}
    .history-photo{width:86px;height:86px;border-radius:13px;border:1px solid var(--line);background:#fff8ef;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;overflow:hidden}
    .history-photo img{width:100%;height:100%;object-fit:cover;display:block}
    @media(max-width:420px){.calendar-day{min-height:62px;padding:4px}.calendar-dish{font-size:9px}.history-card{grid-template-columns:74px 1fr}.history-photo{width:74px;height:74px}}

    /* 分析パネル */
    .cov-count{background:rgba(0,0,0,.08);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:bold;margin-left:4px}
    .cov-tabs{display:flex;gap:4px;background:#f6eadc;border-radius:13px;padding:3px;margin-bottom:4px}
    .cov-tab{
      flex:1;border:0;background:transparent;color:var(--muted);
      padding:7px 6px;border-radius:11px;font-size:12px;font-weight:700;
      display:flex;align-items:center;justify-content:center;gap:4px;
      white-space:nowrap;
    }
    .cov-tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .cov-tab-num{font-size:11px;background:rgba(0,0,0,.08);border-radius:8px;padding:1px 5px;color:#444}
    .cov-tab.on .cov-tab-num{background:#ffe1b8;color:#783800}
    .ing-cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
    .ing-cell{border:1px solid var(--line);background:#fff;border-radius:13px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
    .ing-cell-name{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center}
    .ing-cell-actions{display:flex;gap:4px;flex-wrap:wrap}
    .ing-cell-actions .mini-btn{font-size:11px;padding:4px 7px;flex:1;text-align:center;min-width:0}

    /* AIヘルパー */
    .ai-step{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
    .ai-step-num{
      flex-shrink:0;width:28px;height:28px;border-radius:50%;
      background:var(--accent);color:#fff;font-weight:800;
      display:flex;align-items:center;justify-content:center;font-size:14px;
    }
    .ai-step-body{flex:1;min-width:0}

    /* レシピを増やす(統合パネル)のサブタブ */
    .add-tabs{display:flex;gap:4px;background:#f6eadc;border-radius:13px;padding:3px;margin:8px 0}
    .add-tab{
      flex:1;border:0;background:transparent;color:var(--muted);
      padding:9px 6px;border-radius:11px;font-size:12px;font-weight:700;
      white-space:nowrap;
    }
    .add-tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .add-panel-body{padding:4px 0}
    .cov-group{margin-bottom:14px}
    .cov-group-title{font-weight:bold;font-size:13px;color:var(--muted);margin-bottom:6px}
    .cov-cells{display:flex;flex-wrap:wrap;gap:6px}
    .cov-cell{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
    .cov-cell span{background:rgba(0,0,0,.06);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:bold}
    .cov-cell.cov-zero{background:#fdecea;border-color:#f5b5ad;color:#b03224}
    .cov-cell.cov-zero span{background:#b03224;color:#fff}
    .cov-cell.cov-low{background:#fff4e0;border-color:#f0c98a}
    .cov-cell.cov-low span{background:#d9892a;color:#fff}
    .cov-cell.cov-mid{background:#fffae8;border-color:#e9d27a}
    .cov-cell.cov-high{background:#eaf5e7;border-color:#a7c89c}
    .cov-cell.cov-high span{background:#558a47;color:#fff}
    .taste-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
    .taste-row:last-child{border-bottom:none}
    .taste-kind{font-size:10px;background:rgba(0,0,0,.05);padding:2px 6px;border-radius:8px;color:var(--muted)}
    .gap-idea{padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
    .gap-idea .secondary,.gap-idea .ghost{font-size:12px;padding:4px 10px}

    /* 今日の状況カード */
    .cond-card{padding:14px}
    .cond-section{margin-bottom:8px}
    .cond-label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px}
    .cond-main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    @media(max-width:480px){.cond-main{grid-template-columns:1fr}}
    .cond-main-btn{
      display:flex;align-items:center;gap:10px;padding:11px 12px;
      border:1.5px solid var(--line);border-radius:14px;background:#fffdf9;
      cursor:pointer;text-align:left;transition:all .15s;
      color:var(--ink);font:inherit;
    }
    .cond-main-btn .cond-icon{font-size:22px;line-height:1}
    .cond-main-btn .cond-text{display:flex;flex-direction:column;gap:2px;line-height:1.2}
    .cond-main-btn .cond-text b{font-size:14px;font-weight:800}
    .cond-main-btn .cond-text span{font-size:11px;color:var(--muted)}
    .cond-main-btn.on{
      background:linear-gradient(135deg,#ffe8c8,#fff5e3);
      border-color:#f4a85a;
      box-shadow:0 4px 12px rgba(242,139,56,.15);
    }
    .cond-main-btn.on .cond-text b{color:#783800}
    .cond-extra{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
    .cond-extra summary{list-style:none;cursor:pointer;font-size:13px;font-weight:700;color:#604a36;display:flex;align-items:center;gap:6px}
    .cond-extra summary::-webkit-details-marker{display:none}
    .cond-extra summary::before{content:'▶';font-size:10px;color:var(--muted);transition:transform .2s}
    .cond-extra[open] summary::before{transform:rotate(90deg)}

    /* 冷蔵庫カード(整理版) */
    .pantry-card{padding:14px}
    .pantry-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .tag.on.big{padding:7px 12px;font-size:14px}
    .pantry-all summary{
      list-style:none;cursor:pointer;padding:10px 12px;
      background:#fffdf9;border:1px solid var(--line);border-radius:13px;
      display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;
    }
    .pantry-all summary::-webkit-details-marker{display:none}
    .pantry-all[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
    .pantry-categories{padding:8px 0}

    /* 家族設定 */
    .member-card{padding:14px}
    .member-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
    .member-section{margin:10px 0;padding:8px 0;border-top:1px dashed var(--line)}
    .member-section:first-of-type{border-top:none;padding-top:0}
    .member-label{font-size:13px;font-weight:700;color:#5d4a3a;margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .member-label .dot{font-size:10px}
    .member-label .dot.ng{color:#b03224}
    .member-label .dot.dislike{color:#d9892a}
    .member-label .dot.like{color:#558a47}
    .tag.with-x{padding:4px 4px 4px 10px}
    .tag.with-x .mini-btn{padding:2px 6px;font-size:11px;border:0;background:rgba(0,0,0,.06)}
    .member-add{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
    .member-add summary{list-style:none;cursor:pointer;font-size:14px;color:#604a36;padding:6px 0}
    .member-add summary::-webkit-details-marker{display:none}
    .member-mode{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .member-mode-btn{
      flex:1;min-width:100px;padding:8px 10px;border-radius:12px;font-size:13px;
      border:1.5px solid var(--line);background:#fffdf9;color:var(--ink);font-weight:700;
    }
    .member-mode-btn[data-active="1"]{
      background:linear-gradient(135deg,#ffe8c8,#fff5e3);border-color:#f4a85a;color:#783800;
    }
    .member-preset-group{margin-bottom:6px}
    .chip.mini{padding:5px 10px;font-size:12px;min-height:30px;background:#fff8ef}
    .chip.mini:hover{background:#fff1dd}

    /* レシピの優先表示・並び替え */
    .recipe-controls{display:grid;gap:8px}
    .recipe-sort-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .control-label{display:block}
    .control-label span{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 4px 2px}
    @media(max-width:420px){.recipe-sort-row{grid-template-columns:1fr}}

  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <div>
          <h1>🍽️ 今日なに食べる？</h1>
          <div class="sub">あるもの・旬・家族NGから夕飯候補を3つに絞る</div>
        </div>
        <span class="pill" id="recipeCountPill">🍳 100件</span>
      </div>
    </header>

    <main id="view"></main>
  </div>

  <nav class="tabs" aria-label="メニュー">
    <button class="tab active" data-tab="today"><span>🍽️</span><span>今日</span></button>
    <button class="tab" data-tab="recipes"><span>📚</span><span>レシピ</span></button>
    <button class="tab" data-tab="history"><span>📖</span><span>記録</span></button>
    <button class="tab" data-tab="shopping"><span>🛒</span><span>買い物</span></button>
    <button class="tab" data-tab="settings"><span>👪</span><span>家族</span></button>
    <button class="tab" data-tab="data"><span>💾</span><span>保存</span></button>
  </nav>

  <dialog id="recipeDialog">
    <div class="modal-head between">
      <strong id="modalTitle">レシピ</strong>
      <button class="close" onclick="closeDialog()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </dialog>

  <script type="application/json" id="initial-recipes">[]</script>

  <script>
    const INITIAL_RECIPES = JSON.parse(document.getElementById('initial-recipes').textContent);
const CURATED_URL_RECIPES = [
  {
    "id": "url001",
    "name": "鶏肉の回鍋肉",
    "category": "炒め物",
    "mainType": "",
    "ingredients": [
      "鶏肉",
      "キャベツ",
      "ピーマン",

    function ensureStockForIngredient(target, ing){
      if(!ing) return 0;
      target.recipes = Array.isArray(target.recipes) ? target.recipes : [];
      const existingNames = new Set(target.recipes.map(r => String(r.name || '').trim()));
      let added = 0;
      stockTemplatesForIngredient(ing).forEach(r => {
        if(!existingNames.has(r.name)){
          target.recipes.push(r);
          existingNames.add(r.name);
          added++;
        }
      });
      return added;
    }


    function ensureCuratedUrlRecipes(target){
      if(!target || !Array.isArray(target.recipes)) return 0;
      const existingIds = new Set(target.recipes.map(r => String(r.id || '')));
      const existingUrls = new Set(target.recipes.map(r => String(r.sourceUrl || '').trim()).filter(Boolean));
      const additions = [];
      CURATED_URL_RECIPES.forEach(r => {
        if(existingIds.has(r.id) || existingUrls.has(String(r.sourceUrl || '').trim())) return;
        const item = structuredCloneSafe(r);
        item.mainType = inferMainType(item);
        item.required = deriveShoppingIngredients(item.ingredients || []);
        item.childMode = childModeFromTags(item.tags || []);
        normalizeRecipeForFeatures(item);
        additions.push(item);
      });
      if(additions.length){
        target.recipes = additions.concat(target.recipes);
        target.curatedUrlRecipeVersion = 1;
      }
      return additions.length;
    }

    function ensureIngredientStockRecipes(target){
      const baseIngredients = Object.values(COMMON_INGREDIENTS).flat();
      const extraIngredients = [];
      if(Array.isArray(target.customIngredients)) extraIngredients.push(...target.customIngredients);
      if(Array.isArray(target.pantry)) extraIngredients.push(...target.pantry);
      if(Array.isArray(target.bargain)) extraIngredients.push(...target.bargain);
      let added = 0;
      uniqueList(baseIngredients.concat(extraIngredients)).forEach(ing => {
        added += ensureStockForIngredient(target, ing);
      });
      target.stockRecipeVersion = 2;
      return added;
    }

    function normalizeCategory(r){
      const category = r?.category || '';
      if(category !== '辛い・大人向け') return category || '自作';
      const hay = [r.name, ...(r.ingredients || []), ...(r.required || [])].join(' ');
      if(/カレー|シチュー/.test(hay)) return 'カレー・シチュー';
      if(/ビビンバ|丼|ご飯|チャーハン|炒飯/.test(hay)) return '丼・ご飯';
      if(/春雨|うどん|麺|パスタ|そば|そうめん/.test(hay)) return '麺';
      if(/スンドゥブ|スープ|汁|鍋/.test(hay)) return '汁物・スープ';
      if(/チリコンカン|煮/.test(hay)) return '煮物';
      if(/チキン|鶏|焼き/.test(hay)) return '焼き物';
      return '炒め物';
    }

    function childModeFromTags(tags){
      const list = Array.isArray(tags) ? tags : parseList(tags);
      if(list.includes('子供OK')) return 'ok';
      if(list.includes('子供アレンジ可')) return 'adapt';
      if(list.includes('子供別メニュー前提')) return 'separate';
      return 'unknown';
    }

    function normalizeRecipeTags(tags){
      return uniqueList((Array.isArray(tags) ? tags : parseList(tags))
        .map(t => String(t || '').trim())
        .filter(Boolean)
        .map(t => {
          if(t === 'ダイエット') return 'ヘルシー';
          if(t === '軽め') return '前菜・副菜';
          if(t === 'あっさり') return 'さっぱり';
          return t;
        }));
    }

    function recipeText(r){
      return [
        r?.name, r?.category, r?.mainType, r?.light, r?.memo,
        ...(r?.ingredients || []), ...(r?.required || []), ...(r?.tags || [])
      ].filter(Boolean).join(' ');
    }

    function hasStapleCarb(r){
      const category = String(r?.category || '');
      const mainType = String(r?.mainType || '');
      const tags = normalizeRecipeTags(r?.tags || []);
      const name = String(r?.name || '');
      const ingredientText = [
        ...(r?.ingredients || []),
        ...(r?.required || []),
        ...(r?.optional || [])
      ].filter(Boolean).join(' ');
      const fullText = recipeText({...r, tags});
      // 米・麺・パンなどの主食系炭水化物があるものは「ヘルシー」扱いにしない。
      // ただし、カリフラワーライスなど明確に糖質オフ代替のものは除外しない。
      if(/カリフラワーライス|糖質オフ|低糖質/.test(fullText) && !/ご飯|白米|米|パスタ|スパゲッティ|マカロニ|うどん|そば|そうめん|ラーメン|中華麺|焼きそば|春雨|パン|食パン|餅|もち/.test(ingredientText)) return false;
      if(/ご飯|白米|米|ライス|パスタ|スパゲッティ|マカロニ|うどん|そば|そうめん|ラーメン|中華麺|焼きそば|麺|春雨|パン|食パン|餅|もち/.test(ingredientText)) return true;
      if(/丼|チャーハン|炒飯|炊き込みご飯|混ぜご飯|ドリア|リゾット|カレーライス/.test(name)) return true;
      if(['丼・ご飯','麺','麺類'].includes(category) && mainType === '主食') return true;
      return false;
    }

    function inferFeatureTags(r){
      const out = new Set();
      const tags = normalizeRecipeTags(r?.tags || []);
      const text = recipeText({...r, tags});
      const category = String(r?.category || '');
      const light = String(r?.light || '');
      const carbHeavy = hasStapleCarb({...r, tags});

      const healthyHit = tags.includes('ヘルシー') || tags.includes('低糖質') || /ヘルシー|糖質オフ|低糖質|鶏むね|鶏ささみ|ささみ|豆腐|こんにゃく|蒸し鶏|サラダチキン|野菜たっぷり/.test(text) || category === '蒸し物';
      if(healthyHit && !carbHeavy) out.add('ヘルシー');

      if(tags.includes('前菜・副菜') || /副菜|前菜|小鉢|サラダ|和え物|和え|ナムル|おひたし|冷奴|きんぴら|浅漬け|漬け|マリネ|酢の物/.test(text) || ['副菜','サラダ','サラダ・副菜','和え物'].includes(category)) out.add('前菜・副菜');

      const refreshingHit = tags.includes('さっぱり') || light === 'あっさり' || /さっぱり|ポン酢|ぽん酢|甘酢|黒酢|酢の物|マリネ|梅|レモン|柚子|ゆず|大葉|青じそ|おろし|大根おろし|みぞれ|薬味|ねぎ塩/.test(text);
      // マヨ・チーズは副材料として入るだけでは「こってり」にしない。
      // こってりは、揚げ物・クリーム系・濃厚ソース・タルタル・チーズたっぷり等に限定する。
      const richPattern = /こってり|濃厚|こく旨|コク旨|背脂|バター|クリーム|生クリーム|豚バラ|ベーコン|唐揚げ|から揚げ|天ぷら|フライ|揚げ|カレー|シチュー|タルタル|グラタン|ドリア|マヨたっぷり|マヨネーズたっぷり|マヨソース|チーズたっぷり|濃厚チーズ|チーズソース|チーズ焼き|チーズフォンデュ/;
      const richHit = tags.includes('こってり') || light === 'こってり' || light === '重め' || category === '揚げ物' || category === 'カレー・シチュー' || richPattern.test(text);
      const richStrong = light === 'こってり' || light === '重め' || category === '揚げ物' || category === 'カレー・シチュー' || richPattern.test(text);

      // 「さっぱり」と「こってり」は両立させない。
      // 両方に引っかかる場合は、明確に濃厚なもの以外は「さっぱり」を優先。
      if(refreshingHit && richHit){
        out.add(richStrong ? 'こってり' : 'さっぱり');
      }else if(refreshingHit){
        out.add('さっぱり');
      }else if(richHit){
        out.add('こってり');
      }

      if(tags.includes('温まる') || ['汁物','汁物・スープ','鍋','鍋物','煮物','麺','麺類','カレー・シチュー'].includes(category) || /温まる|あったか|熱々|スープ|汁|味噌汁|みそ汁|豚汁|鍋|鍋物|煮込み|煮物|うどん|ラーメン|シチュー|カレー|あんかけ|とろみ|湯豆腐/.test(text)) out.add('温まる');

      return [...out];
    }

    function normalizeRecipeForFeatures(r){
      if(!r) return r;
      const rawTags = normalizeRecipeTags(r.tags);
      if(r.light === '軽め') r.light = '普通';
      // 手動編集済みのレシピは、ユーザーが選んだ特徴タグを正とする。
      // これにより、一度消した「こってり」などが自動推定で復活しない。
      if(r.featureTagsManual){
        r.tags = uniqueList(rawTags);
        return r;
      }
      // 未編集のレシピだけ特徴タグを自動推定する。
      // 旧版で自動付与された特徴タグ自体は推定根拠にしない。
      const baseTags = rawTags.filter(t => !FEATURE_TAGS.includes(t));
      r.tags = uniqueList(baseTags.concat(inferFeatureTags({...r, tags: baseTags})));
      return r;
    }

    function recipeHasFeature(r, feature){
      const tags = normalizeRecipeTags(r?.tags || []);
      if(tags.includes(feature)) return true;
      if(r?.featureTagsManual) return false;
      return inferFeatureTags({...r, tags}).includes(feature);
    }

    function featureBadgesHtml(r, limit = 3){
      const tags = FEATURE_TAGS.filter(t => recipeHasFeature(r, t)).slice(0, limit);
      return tags.map(t => `<span class="tag ${t==='ヘルシー'?'good':t==='こってり'?'hot':''}">${t}</span>`).join('');
    }

    function recipeHasSource(r){
      return !!(r && r.sourceUrl && String(r.sourceUrl).trim());
    }

    function isIdeaRecipe(r){
      if(!r) return false;
      if(recipeHasSource(r) || r.teppan || r.custom || r.modified) return false;
      return !!r.stock || r.sourceKind === 'idea' || String(r.id || '').startsWith('stock_') || (Array.isArray(r.tags) && r.tags.includes('アイデア候補'));
    }

    function visibleRecipeTags(r, limit = 4){
      const tags = normalizeRecipeTags(r?.tags || []);
      return tags.filter(t => !['アイデア候補','参考URLあり','要補完','AI補完済み'].includes(t)).slice(0, limit);
    }

    function qualityBadgesHtml(r){
      const badges = [];
      if(r.teppan) badges.push('<span class="tag good">鉄板</span>');
      if(recipeHasSource(r)) badges.push('<span class="tag blue">参考URLあり</span>');
      if(isIdeaRecipe(r)) badges.push('<span class="tag">アイデア候補</span>');
      if((r.custom || r.modified) && !r.teppan) badges.push('<span class="tag blue">自作・編集済み</span>');
      return badges.join('');
    }

    function normalizeLoadedData(obj){
      // 旧版データの表示名を補正する。
      // 「パパ好み」はユーザーが好み設定を入れていなくても出てしまうため、
      // 汎用タグ名に置換する。
      if(Array.isArray(obj.recipes)){
        obj.recipes.forEach(r => {
          if(Array.isArray(r.tags)){
            r.tags = normalizeRecipeTags(r.tags.map(t => (t === 'パパ好み' || t === '辛いもの好き向け') ? '辛い' : t));
          } else {
            r.tags = [];
          }
          if(r.spicy && !r.tags.includes('辛い')) r.tags.push('辛い');
          if(r.stock || r.sourceKind === 'idea' || String(r.id || '').startsWith('stock_')){
            r.stock = true;
            r.sourceKind = 'idea';
            if(!recipeHasSource(r) && !r.tags.includes('アイデア候補')) r.tags.push('アイデア候補');
          }
          if(recipeHasSource(r)){
            r.sourceKind = 'url';
            r.tags = r.tags.filter(t => t !== 'アイデア候補');
            r.stock = false;
          }
          r.category = normalizeCategory(r);
          if(!r.childMode || r.childMode === 'unknown') r.childMode = childModeFromTags(r.tags);
          if(!r.mainType || r.mainType === '辛い' || r.mainType === '辛いもの好き向け' || r.mainType === 'パパ好み'){
            r.mainType = inferMainType(r);
          }
          normalizeRecipeForFeatures(r);
        });
      }
      if(Array.isArray(obj.history)){
        obj.history.forEach(h => {
          if(!h.at) h.at = `${h.date || todayKey()}-${Math.random().toString(36).slice(2)}`;
          if(!h.date && h.at && /^\d{4}-\d{2}-\d{2}/.test(h.at)) h.date = h.at.slice(0,10);
          if(!h.date) h.date = todayKey();
        });
      }
      // 初期値として入っていたパパの好みは、未編集と判断できる場合のみ空に戻す。
      if(obj.family && Array.isArray(obj.family.members)){
        obj.family.members.forEach(m => {
          if(m.id === 'papa' && m.likes === '辛いもの,キムチ,唐辛子') m.likes = '';
        });
      }
      return obj;
    }

    function loadData(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw){
          const fresh = normalizeLoadedData(defaultData());
          ensureCuratedUrlRecipes(fresh);
          // ensureIngredientStockRecipes(fresh); // URL無しのアイデア自動生成は無効化
          return fresh;
        }
        const saved = JSON.parse(raw);
        const base = defaultData();
        const merged = {...base, ...saved};
        merged.recipes = Array.isArray(saved.recipes) && saved.recipes.length ? saved.recipes : base.recipes;
        merged.family = saved.family || base.family;
        merged.history = saved.history || [];
        merged.stats = saved.stats || {};
        merged.pantry = saved.pantry || [];
        const baseSet = baseIngredientSet();
        const savedCustom = Array.isArray(saved.customIngredients) ? saved.customIngredients : [];
        const pantryCustom = merged.pantry.filter(x => !baseSet.has(x));
        merged.customIngredients = uniqueList(savedCustom.concat(pantryCustom));
        merged.bargain = saved.bargain || [];
        merged.shoppingList = saved.shoppingList || [];
        merged.shoppingDone = saved.shoppingDone || {};
        const normalized = normalizeLoadedData(merged);
        // 既存のstock/idea(URL無し&自動生成)レシピを除去
        // ただしユーザーが追加したcustomレシピは残す
        normalized.recipes = (normalized.recipes || []).filter(r => {
          if(r.custom) return true; // ユーザー自作は残す
          if(r.teppan) return true; // 鉄板に登録済みも残す
          if(recipeHasSource(r)) return true; // URLあるものは残す
          return false; // それ以外(stock, idea, アイデア候補)は除去
        });
        ensureCuratedUrlRecipes(normalized);
        // ensureIngredientStockRecipes(normalized); // URL無しのアイデア自動生成は無効化
        return normalized;
      }catch(e){
        console.warn(e);
        const fresh = normalizeLoadedData(defaultData());
        ensureCuratedUrlRecipes(fresh);
        // ensureIngredientStockRecipes(fresh); // URL無しのアイデア自動生成は無効化
        return fresh;
      }
    }

    function condExtraSummary(){
      const arr = [];
      if(state.modes.tired) arr.push('疲れ');
      if(state.modes.childSame) arr.push('子供同じ');

      if(state.modes.healthy) arr.push('ヘルシー');

      if(state.modes.rich) arr.push('こってり');
      if(state.modes.warming) arr.push('温まる');
      return arr.length ? '(' + arr.join('・') + ')' : '';
    }

    // 履歴+鉄板から「最近よく使う食材」を抽出
    function computeRecentlyUsedIngredients(limit = 8){
      const recent = (data.history || []).slice(0, 30);
      const counts = {};
      recent.forEach(h => {
        const r = recipeById(h.recipeId);
        if(!r) return;
        (r.ingredients || []).forEach(ing => {
          if(STAPLES.has(ing)) return;
          counts[ing] = (counts[ing] || 0) + 1;
        });
      });
      // 鉄板にある食材も加点
      data.recipes.filter(r => r.teppan).forEach(r => {
        (r.ingredients || []).forEach(ing => {
          if(STAPLES.has(ing)) return;
          counts[ing] = (counts[ing] || 0) + 0.5;
        });
      });
      return Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, limit).map(([k]) => k);
    }

    function ingredientGroups(groups, selected, target){

        return `
          <details class="ingredient-group" ${open ? 'open' : ''}>

    function ingredientCatalog(){
      const catalog = structuredCloneSafe(COMMON_INGREDIENTS);
      uniqueList(data.customIngredients || []).forEach(item => {
        const group = categorizeIngredient(item);
        if(!catalog[group]) catalog[group] = [];
        if(!catalog[group].includes(item)) catalog[group].push(item);
      });
      Object.keys(catalog).forEach(group => {
        catalog[group] = uniqueList(catalog[group]).sort((a,b) => a.localeCompare(b, 'ja'));
      });
      return catalog;
    }

    function baseIngredientSet(){
      return new Set(Object.values(COMMON_INGREDIENTS).flat());
    }

    function uniqueList(arr){
      return [...new Set((arr || []).filter(Boolean))];
    }

    function categorizeIngredient(item){
      const s = String(item || '');
      for(const [group, items] of Object.entries(COMMON_INGREDIENTS)){
        if(items.includes(s)) return group;
      }
      if(/大根|にんじん|人参|じゃが|芋|さつま|ごぼう|れんこん|蓮根|かぶ|里芋|長芋/.test(s)) return '野菜・根菜';
      if(/キャベツ|白菜|小松菜|ほうれん|レタス|水菜|春菊|ニラ|ねぎ|葱|大葉|しそ|紫蘇|チンゲン|青梗菜|空芯菜|豆苗/.test(s)) return '野菜・葉物';
      if(/トマト|ミニトマト|なす|茄子|ピーマン|パプリカ|きゅうり|胡瓜|ズッキーニ|オクラ|かぼちゃ|ゴーヤ|とうもろこし/.test(s)) return '野菜・果菜';
      if(/きのこ|しめじ|えのき|舞茸|まいたけ|椎茸|しいたけ|エリンギ|マッシュルーム/.test(s)) return 'きのこ';
      if(/もやし|枝豆|豆苗|ブロッコリー|菜の花|たけのこ|スナップ/.test(s)) return '豆・その他野菜';
      if(/豚|鶏|牛|肉|ウインナー|ベーコン|ハム|ソーセージ|ささみ/.test(s)) return '肉';
      if(/魚|鮭|サーモン|さば|鯖|ぶり|しらす|ツナ|まぐろ|たら|白身|えび|海老|いか|イカ|ほたて|帆立|かにかま/.test(s)) return '魚・海鮮';
      if(/卵|玉子|たまご|豆腐|厚揚げ|油揚げ|納豆|大豆|豆|チーズ|牛乳|豆乳|こんにゃく|しらたき/.test(s)) return '卵・豆腐・大豆';
      if(/ご飯|米|うどん|そば|そうめん|麺|パスタ|春雨|パン/.test(s)) return '主食';
      if(/缶|乾物|ひじき|わかめ|海苔|キムチ|レトルト/.test(s)) return '缶詰・乾物・その他';
      return '缶詰・乾物・その他';
    }

    function inferMainType(recipe){
      const name = recipe?.name || '';
      const category = recipe?.category || '';
      const ingredients = Array.isArray(recipe?.ingredients) ? recipe.ingredients : [];
      const required = Array.isArray(recipe?.required) ? recipe.required : [];
      const hay = [name, category, ...ingredients, ...required].join(' ');
      if(/鮭|サーモン|さば|鯖|ぶり|たら|白身魚|しらす|ツナ|まぐろ|魚|えび|海老|いか|イカ|ほたて|帆立|かにかま/.test(hay)) return '魚';
      if(/豚|鶏|牛|ひき肉|挽き肉|肉|ウインナー|ベーコン|ハム|ソーセージ|ささみ/.test(hay)) return '肉';
      if(/豆腐|厚揚げ|油揚げ|納豆|卵|玉子|たまご|大豆|豆乳/.test(hay)) return '卵・豆腐';
      if(/丼|ご飯|チャーハン|炒飯|オムライス|麺|うどん|そば|そうめん|パスタ|焼きそば|春雨|パン/.test(hay)) return '主食';
      if(/汁物|スープ|味噌汁|みそ汁|豚汁|鍋/.test(hay)) return '汁物';
      if(/野菜|キャベツ|白菜|小松菜|ほうれん草|レタス|なす|トマト|きゅうり|大根|にんじん|玉ねぎ|じゃがいも|ピーマン|ブロッコリー|もやし|きのこ|しめじ|えのき/.test(hay)) return '野菜';
      return 'その他';
    }

    function renderCandidates(){

    function candidateCard(item, idx){
      const r = item.recipe;

      const tags = [
        childTagHtml(r.childMode),
        r.spicy ? '<span class="tag hot">辛い</span>' : '',

      return `
        <div class="card candidate">

          <div style="margin-top:8px">
            ${used.length ? `<div><b>使うあるもの：</b>${used.join('、')}</div>` : `<div><b>使うあるもの：</b>少なめ</div>`}
            <div><b>買い足し：</b>${missing.length ? missing.join('、') : 'なし'}</div>

          <div class="actions three">
            <button class="primary" onclick="chooseRecipe('${r.id}')">これにする</button>
            <button class="secondary" onclick="openRecipe('${r.id}')">レシピを見る</button>
            <button class="ghost" onclick="showRejectBox('${r.id}')">今日は違う</button>
          </div>
          <div id="reject-${r.id}" class="hidden" style="margin-top:10px">
            <div class="small" style="margin-bottom:6px">理由を選ぶと、次回以降の候補出しに少し反映します。</div>
            <div class="chips">${REJECT_REASONS.map(reason => `<button class="secondary" onclick="rejectOneAndRegenerate('${r.id}','${reason.id}')">${reason.label}</button>`).join('')}</div>
          </div>
        </div>
      `;
    }

    function generateCandidates(reset){
      if(reset){
        state.excludedToday = new Set();
        state.filtersToday = {};
        state.relaxedNotice = '';
      }
      const scored = data.recipes.map(r => scoreRecipe(r)).filter(x => x.score > -9999 && !state.excludedToday.has(x.recipe.id));
      scored.sort((a,b) => b.score - a.score);
      let chosen = scored.slice(0,3);
      state.relaxedNotice = '';
      if(chosen.length < 3){
        const relaxed = data.recipes.map(r => scoreRecipe(r, {relaxed:true})).filter(x => x.score > -9999 && !state.excludedToday.has(x.recipe.id)).sort((a,b)=>b.score-a.score);
        chosen = relaxed.slice(0,3);
        state.relaxedNotice = '条件に合う候補が少ないため、完全NG以外の条件を少しゆるめました。';
      }
      if(!chosen.length){
        const fallback = data.recipes.map(r => scoreRecipe(r, {ignoreToday:true, relaxed:true})).filter(x => x.score > -9999).sort((a,b)=>b.score-a.score);
        chosen = fallback.slice(0,3);
        state.relaxedNotice = '候補が尽きたため、今日すでに出した候補も含めて再表示しています。';
      }
      state.currentCandidates = chosen;
      render();
      setTimeout(()=>document.getElementById('candidates')?.scrollIntoView({behavior:'smooth', block:'start'}), 50);
    }

    function scoreRecipe(r, opt={}){
      const reasons = [];
      let score = 0;
      const adultHardNg = allTerms(data.family.members.filter(m => m.role !== 'child').flatMap(m => [m.hardNg]));
      const child = data.family.members.find(m => m.role === 'child');
      const childHardNg = child ? allTerms([child.hardNg]) : [];
      const hardNg = state.modes.childSame ? adultHardNg.concat(childHardNg) : adultHardNg;
      const hitNg = hardNg.find(term => recipeContains(r, term));
      if(hitNg) return {recipe:r, score:-10000, reasons:[`完全NG「${hitNg}」に該当`]};

      if(!opt.ignoreToday && state.excludedToday.has(r.id)) return {recipe:r, score:-10000, reasons:['今日すでに除外']};

      if(r.teppan){ score += 8; reasons.push('鉄板レシピ'); }
      const stats = data.stats[r.id] || {};
      if(stats.accepted){ score += Math.min(8, stats.accepted * 1.5); reasons.push('過去に選んだ実績あり'); }
      if(stats.rejected){ score -= Math.min(8, stats.rejected * 0.7); }
      if(recipeHasSource(r)){ score += 7; reasons.push('参考URLあり'); }
      if((r.custom || r.modified) && !isIdeaRecipe(r)){ score += 4; reasons.push('自作・編集済み'); }
      if(isIdeaRecipe(r)){ score -= 8; reasons.push('外部未確認のアイデア候補'); }

      const pantryHits = r.ingredients.filter(x => hasIngredientInList(x, data.pantry));
      const missing = missingIngredients(r);
      if(state.modes.pantry && !state.modes.empty){
        score += pantryHits.length * 6;
        if(pantryHits.length) reasons.push(`あるものを${pantryHits.length}個使える`);
        score -= missing.length * (state.filtersToday.limitShopping ? 3.2 : 1.4);
        if(!missing.length) { score += 8; reasons.push('買い足しなし'); }
      }
      if(state.modes.empty){
        score += r.tags.includes('買い物少なめ') ? 5 : 0;
        score -= Math.max(0, missing.length - 4) * 1.4;
        reasons.push('冷蔵庫なんもない前提');
      }
      if(state.modes.shopping){
        score += 3;
        reasons.push('買い物前提でも作りやすい');
      }

      const month = TODAY.getMonth()+1;
      const seasonal = SEASONAL[month] || [];
      const seasonalHits = r.ingredients.filter(x => hasIngredientInList(x, seasonal));
      const bargainHits = r.ingredients.filter(x => hasIngredientInList(x, data.bargain));
      if(state.modes.seasonal){
        score += seasonalHits.length * 2.3;
        score += bargainHits.length * 5;
        if(seasonalHits.length) reasons.push(`旬食材：${seasonalHits.join('、')}`);
        if(bargainHits.length) reasons.push(`買いたい食材：${bargainHits.join('、')}`);
      }

      if(state.modes.tired || state.filtersToday.preferEasy){
        if(r.time <= 15){ score += 6; reasons.push('15分以内'); }
        else if(r.time <= 20){ score += 3; reasons.push('20分以内'); }
        if(r.tags.includes('疲れている日')) score += 4;
        if(r.difficulty === 'かんたん') score += 2;
      }

      if(state.modes.childSame || state.filtersToday.preferChild){
        if(r.childMode === 'ok'){ score += 7; reasons.push('子供OK'); }
        if(r.childMode === 'adapt'){ score += 2; reasons.push('子供アレンジ可'); }
        if(r.childMode === 'separate'){ score -= opt.relaxed ? 3 : 12; reasons.push('子供別メニュー前提'); }
      } else {
        if(r.childMode === 'separate') reasons.push('子供は別メニュー前提');
      }

      if(state.modes.spicyAdult){
        if(r.spicy){ score += 9; reasons.push('辛いもの候補'); }
        if(r.tags.includes('辛い')){ score += 5; reasons.push('辛い'); }
      }

      const featurePrefs = [
        [state.modes.healthy, 'ヘルシー', 8],
        [state.modes.sideDish, '前菜・副菜', 8],
        [state.modes.refreshing, 'さっぱり', 8],
        [state.modes.rich, 'こってり', 8],
        [state.modes.warming, '温まる', 8]
      ];
      featurePrefs.forEach(([on, feature, point]) => {
        if(!on) return;
        if(recipeHasFeature(r, feature)){ score += point; reasons.push(feature); }
        else score -= opt.relaxed ? 1 : 3;
      });
      if(state.modes.healthy && recipeHasFeature(r, 'こってり')) score -= opt.relaxed ? 3 : 9;
      if(state.modes.sideDish && (r.mainType === '主食' || /丼|ご飯|麺|パスタ|カレー/.test(r.category || ''))) score -= opt.relaxed ? 3 : 10;

      const likes = allTerms(data.family.members.flatMap(m => [m.likes]));
      const dislikes = allTerms(data.family.members.filter(m => state.modes.childSame || m.role !== 'child').flatMap(m => [m.dislikes]));
      likes.forEach(term => {
        if(recipeContains(r, term) || (term.includes('辛') && r.spicy)){ score += 1.5; }
      });
      dislikes.forEach(term => {
        if(recipeContains(r, term)){ score -= 3; reasons.push(`苦手「${term}」は少し減点`); }
      });

      const last = lastCookedDate(r.id);
      if(last){
        const days = daysSince(last);
        if(days <= 3){ score -= opt.relaxed ? 5 : 13; reasons.push(`${days}日前に作った`); }
        else if(days <= 7){ score -= 7; reasons.push(`${days}日前に作ったので少し減点`); }
        else if(days <= 14){ score -= 3; }
      }

      if(state.filtersToday.noMeat && isMeat(r)){ score -= opt.relaxed ? 6 : 18; }
      if(state.filtersToday.noFish && isFish(r)){ score -= opt.relaxed ? 6 : 18; }
      if(state.filtersToday.preferLight){
        if(recipeHasFeature(r, 'ヘルシー') || recipeHasFeature(r, 'さっぱり') || recipeHasFeature(r, '前菜・副菜')){ score += 7; reasons.push('重くない'); }
        if(recipeHasFeature(r, 'こってり') || r.light === '重め'){ score -= opt.relaxed ? 4 : 12; }
      }
      if(state.filtersToday.avoidRecentCategory && r.category === state.filtersToday.avoidRecentCategory){ score -= 8; }

      score += Math.random() * 2.2;
      return {recipe:r, score, reasons};
    }

    function isMeat(r){
      return r.mainType === '肉' || r.ingredients.some(x => /豚|鶏|牛|肉|ウインナー|ベーコン|ハム/.test(x));
    }
    function isFish(r){
      return r.mainType === '魚' || r.ingredients.some(x => /魚|鮭|さば|ぶり|しらす|ツナ/.test(x));
    }

    function deriveShoppingIngredients(ingredients){
      return uniqueList((ingredients || [])
        .map(x => String(x || '').trim())
        .filter(Boolean)
        .filter(x => !STAPLES.has(x))
        .filter(x => x !== 'ご飯')
        .filter(x => !/^(水|お湯|油|サラダ油|ごま油)$/.test(x)));
    }

    function missingIngredients(r){
      const base = Array.isArray(r.required) && r.required.length ? r.required : deriveShoppingIngredients(r.ingredients || []);
      return base
        .filter(x => !hasIngredientInList(x, data.pantry))
        .filter(x => !STAPLES.has(x))
        .filter(x => x !== 'ご飯');
    }

    function chooseRecipe(id){
      const r = recipeById(id);
      if(!r) return;
      const stats = data.stats[id] || {};
      stats.accepted = (stats.accepted || 0) + 1;
      data.stats[id] = stats;
      data.history.unshift({recipeId:id, name:r.name, date:todayKey(), at:new Date().toISOString(), photoDataUrl:'', memo:''});
      data.history = data.history.slice(0,120);
      const missing = missingIngredients(r);
      data.shoppingList = missing.map(name => ({name, recipeId:id, recipeName:r.name, createdAt:new Date().toISOString()}));
      data.shoppingDone = {};
      saveData();
      activeTab = 'shopping';
      render();
    }

    function rejectCurrentAndRegenerate(reasonId){
      const ids = state.currentCandidates.map(x=>x.recipe.id);
      if(!ids.length){ generateCandidates(true); return; }
      registerReject(ids, reasonId);
      ids.forEach(id => state.excludedToday.add(id));
      applyReasonFilter(reasonId, ids);
      generateCandidates(false);
    }

    function rejectOneAndRegenerate(id, reasonId){
      registerReject([id], reasonId);
      state.excludedToday.add(id);
      applyReasonFilter(reasonId, [id]);
      generateCandidates(false);
    }

    function registerReject(ids, reasonId){
      ids.forEach(id => {
        const stats = data.stats[id] || {};
        stats.rejected = (stats.rejected || 0) + 1;
        stats.reasons = stats.reasons || {};
        stats.reasons[reasonId] = (stats.reasons[reasonId] || 0) + 1;
        data.stats[id] = stats;
      });
      saveData();
    }

    function applyReasonFilter(reasonId, ids){
      if(reasonId === 'noMeat') state.filtersToday.noMeat = true;
      if(reasonId === 'noFish') state.filtersToday.noFish = true;
      if(reasonId === 'heavy') state.filtersToday.preferLight = true;
      if(reasonId === 'tooHard') state.filtersToday.preferEasy = true;
      if(reasonId === 'tooMuchShopping') state.filtersToday.limitShopping = true;
      if(reasonId === 'child') state.filtersToday.preferChild = true;
      if(reasonId === 'recent'){
        const first = recipeById(ids[0]);
        if(first) state.filtersToday.avoidRecentCategory = first.category;
      }
    }

    function showRejectBox(id){
      document.getElementById(`reject-${id}`)?.classList.toggle('hidden');
    }

    // ========== 分析機能 ==========
    // 主要食材リスト(カバレッジ可視化対象)
    const COVERAGE_INGREDIENTS = {
      '主菜（肉・魚）': ['鶏もも','鶏むね','鶏ささみ','豚こま','豚バラ','豚ロース','牛こま','牛肉','合挽肉','鶏ひき肉','豚ひき肉','鮭','鯖','ぶり','まぐろ','たら','えび','いか','ホタテ','ツナ','卵','豆腐','厚揚げ','油揚げ','納豆'],
      '葉物・実野菜': ['キャベツ','白菜','レタス','ほうれん草','小松菜','水菜','ニラ','ねぎ','長ねぎ','玉ねぎ','ピーマン','パプリカ','なす','トマト','ミニトマト','きゅうり','ズッキーニ','ゴーヤ','オクラ','アスパラ','ブロッコリー','カリフラワー','スナップエンドウ','枝豆','とうもろこし','かぼちゃ'],
      '根菜・きのこ・芋': ['にんじん','大根','じゃがいも','さつまいも','里芋','ごぼう','れんこん','かぶ','しめじ','まいたけ','エリンギ','えのき','しいたけ','マッシュルーム','長芋'],
      '主食・乾物・その他': ['ご飯','米','うどん','そば','パスタ','中華麺','食パン','餃子の皮','春巻きの皮','春雨','わかめ','ひじき','切り干し大根','高野豆腐','チーズ','牛乳','ヨーグルト']
    };

    // 食材名でレシピをカウント(ゆるい部分一致)
    function countRecipesWithIngredient(ingName, recipes){
      const target = String(ingName).toLowerCase();
      return recipes.filter(r => {
        const all = (r.ingredients || []).map(x => String(x).toLowerCase()).join('|');
        return all.includes(target);
      }).length;
    }

    // 食材カバレッジを計算
    function computeCoverage(){
      const result = {};
      Object.entries(COVERAGE_INGREDIENTS).forEach(([group, items]) => {
        result[group] = items.map(name => ({
          name,
          count: countRecipesWithIngredient(name, data.recipes),
          inPantry: hasIngredientInList(name, data.pantry)
        }));
      });
      return result;
    }

    // タグ・カテゴリの傾向(全レシピ vs 鉄板/履歴)
    function computeTagDistribution(){
      // タグ集計対象は category + tags(ノイズが少ないもの)
      function tagsOf(r){
        const t = [];
        if(r.category) t.push('cat:' + r.category);
        (r.tags || []).forEach(tg => {
          if(tg === '参考URLあり') return;
          if(tg === '楽天レシピ') return;
          t.push('tag:' + tg);
        });
        if(r.spicy) t.push('attr:辛い');
        if(r.time && r.time <= 15) t.push('attr:時短');
        if(r.childMode === 'ok') t.push('attr:子供OK');
        if(r.childMode === 'separate') t.push('attr:子供別');
        return t;
      }
      const all = {};
      const liked = {};
      // 鉄板 + 履歴を「好き」とみなす
      const likedIds = new Set(data.recipes.filter(r => r.teppan).map(r => r.id));
      (data.history || []).forEach(h => likedIds.add(h.recipeId));
      data.recipes.forEach(r => {
        const t = tagsOf(r);
        const isLiked = likedIds.has(r.id);
        const stats = data.stats[r.id] || {};
        const accepted = stats.accepted || 0;
        const weight = isLiked ? 1 + accepted * 0.5 : 0;
        t.forEach(tg => {
          all[tg] = (all[tg] || 0) + 1;
          if(weight > 0) liked[tg] = (liked[tg] || 0) + weight;
        });
      });
      // 各タグの「好み度」= (好きレシピでの出現率) / (全レシピでの出現率)
      const totalLiked = Object.values(liked).reduce((a,b)=>a+b, 0) || 1;
      const totalAll = Object.values(all).reduce((a,b)=>a+b, 0) || 1;
      const score = {};
      Object.keys(all).forEach(tg => {
        const allRate = (all[tg] || 0) / totalAll;
        const likedRate = (liked[tg] || 0) / totalLiked;
        score[tg] = {
          allCount: all[tg] || 0,
          likedCount: liked[tg] || 0,
          ratio: allRate > 0 ? likedRate / allRate : 0
        };
      });
      return score;
    }

    // 好みベクトル(レシピ類似度ソート用)
    function computePreferenceVector(){
      const dist = computeTagDistribution();
      const vec = {};
      Object.entries(dist).forEach(([tg, s]) => {
        if(s.likedCount > 0) vec[tg] = s.likedCount; // 出現回数を重みに
      });
      return vec;
    }

    // 個別レシピと好みベクトルの近さ
    function recipeSimilarityScore(r, prefVec){
      if(!prefVec) prefVec = computePreferenceVector();
      let score = 0;
      const tags = [];
      if(r.category) tags.push('cat:' + r.category);
      (r.tags || []).forEach(tg => {
        if(tg === '参考URLあり') return;
        if(tg === '楽天レシピ') return;
        tags.push('tag:' + tg);
      });
      if(r.spicy) tags.push('attr:辛い');
      if(r.time && r.time <= 15) tags.push('attr:時短');
      if(r.childMode === 'ok') tags.push('attr:子供OK');
      if(r.childMode === 'separate') tags.push('attr:子供別');
      tags.forEach(tg => { score += (prefVec[tg] || 0); });
      return score;
    }

    // カテゴリのカバレッジ(空き枠検出)
    function computeCategoryCoverage(){
      const cats = {};
      data.recipes.forEach(r => {
        const c = r.category || '未分類';
        cats[c] = (cats[c] || 0) + 1;
      });
      return cats;
    }

    // 分析パネル本体

    // 機能A: 食材カバレッジ(整頓版)
    function analysisCoverageView(){
      const cov = computeCoverage();
      const allItems = Object.values(cov).flat();
      const zeroes = allItems.filter(it => it.count === 0);
      const fewest = allItems.filter(it => it.count > 0).sort((a,b) => a.count - b.count).slice(0, 12);
      const inPantryFewest = fewest.filter(it => it.inPantry);
      const renderIngCell = (it, withCount = true) => `
        <div class="ing-cell">

            <button class="mini-btn ing-act-search" onclick="searchAndAddRecipe('${escAttr(it.name)}')" title="ネット検索してURLで追加">🔍 探す</button>
            ${it.count > 0 ? `<button class="mini-btn" onclick="state.recipeQuery='${escAttr(it.name)}'; state.analysisOpen=false; render()" title="登録済みレシピを表示">📚 ${it.count}件</button>` : ''}
          </div>
        </div>
      `;
      // タブ的に切り替え
      const tab = state.coverageTab || 'pantry';

        ['zero', `📭 レシピなし`, zeroes, 'レシピが1件もない食材。検索してURLで追加してみましょう。'],
        ['few', `🔻 少ない`, fewest, '登録レシピが少ない食材TOP12。バリエーション増やすチャンス。']
      ];
      const activeSection = sections.find(s => s[0] === tab) || sections[0];
      const [, , items, desc] = activeSection;
      return `
        <div class="cov-tabs">
          ${sections.map(([id, label, list]) => `
            <button class="cov-tab ${tab===id?'on':''}" onclick="state.coverageTab='${id}'; render()">
              ${label} <span class="cov-tab-num">${list.length}</span>
            </button>
          `).join('')}
        </div>
        <div class="small" style="color:var(--muted);margin:8px 0">${desc}</div>
        ${items.length ? `
          <div class="ing-cells">
            ${items.slice(0, 20).map(it => renderIngCell(it, tab !== 'zero')).join('')}
          </div>
          ${items.length > 20 ? `<div class="small" style="margin-top:6px;color:var(--muted)">ほか${items.length-20}件は省略</div>` : ''}
        ` : `<div class="empty" style="margin:8px 0">該当する食材はありません。</div>`}
      `;
    }

    // 食材から検索画面に飛ばす(URL貼り付けフォームへ)
    function searchAndAddRecipe(ing){
      const q = encodeURIComponent(ing + ' レシピ 人気');

    // 機能B: 好み傾向
    function analysisTasteView(){
      const dist = computeTagDistribution();
      const rows = Object.entries(dist)
        .filter(([,s]) => s.likedCount >= 1)
        .sort((a,b) => b[1].likedCount - a[1].likedCount)
        .slice(0, 20);
      if(!rows.length) return `<div class="empty">まだ鉄板登録や履歴が少なくて好み傾向が出ません。鉄板にしたり「これにする」を何回かしてみてください。</div>`;
      const items = rows.map(([tg, s]) => {
        const label = tg.startsWith('cat:') ? tg.slice(4) : tg.startsWith('tag:') ? tg.slice(4) : tg.startsWith('attr:') ? tg.slice(5) : tg;
        const kind = tg.startsWith('cat:') ? 'カテゴリ' : tg.startsWith('attr:') ? '属性' : 'タグ';
        const star = s.ratio >= 1.5 ? '⭐️' : s.ratio >= 1.2 ? '✨' : '';
        return `<div class="taste-row"><span class="taste-kind">${kind}</span><b>${label}</b> ${star}<span class="small" style="margin-left:auto;color:var(--muted)">好き${s.likedCount}回 / 全${s.allCount}件</span></div>`;
      }).join('');

    // 機能D(プチ版): 空き枠の提案
    function analysisGapsView(){
      const cats = computeCategoryCoverage();
      const sortedCats = Object.entries(cats).sort((a,b) => a[1] - b[1]);
      const lowCats = sortedCats.filter(([,n]) => n < 5).slice(0, 8);
      const highCats = sortedCats.slice(-5).reverse();
      // 「鉄板の食材 × 少ないカテゴリ」で組み合わせ提案
      const teppanIngs = new Set();
      data.recipes.filter(r => r.teppan).forEach(r => (r.ingredients || []).forEach(i => teppanIngs.add(i)));
      const cov = computeCoverage();
      const sparseIngs = Object.values(cov).flat().filter(it => it.count <= 2).map(it => it.name);
      const ideas = [];
      lowCats.forEach(([cat]) => {
        sparseIngs.slice(0, 3).forEach(ing => {
          ideas.push({cat, ing});
        });
      });
      const ideasHtml = ideas.slice(0, 12).map(({cat, ing}) => {
        const q = encodeURIComponent(`${ing} ${cat} レシピ`);
        return `<div class="gap-idea">
          <div><b>${ing}</b> × <b>${cat}</b></div>
          <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">

            <a class="secondary" href="https://cookpad.com/search/${encodeURIComponent(ing+' '+cat)}" target="_blank" rel="noopener">クックパッド</a>

            <button class="ghost" onclick="prefillUrlForm('${escAttr(ing)}', '${escAttr(cat)}')">URLで追加へ</button>

      }).join('');
      return `
        <div class="small" style="color:var(--muted);margin-bottom:8px">登録が少ないカテゴリ・食材から、レシピを増やせそうな組み合わせを提案します。検索 → よさそうなURLを「URLで追加へ」で貼り付け。</div>

        </div>
        ${ideas.length ? `<div class="card" style="margin-top:8px"><b>💡 組み合わせアイデア</b><div class="small" style="margin-top:6px;color:var(--muted)">少ないカテゴリ × レシピ数の少ない食材。検索でレシピを見つけたら「URLで追加へ」を押すと、URL貼り付けフォームに食材とカテゴリが自動入力されます。</div><div style="margin-top:8px">${ideasHtml}</div></div>` : ''}
      `;
    }

    // URL貼り付けでレシピを半自動追加
    function quickAddRecipeFromUrl(){
      const urlEl = document.getElementById('quickUrlInput');
      const nameEl = document.getElementById('quickNameInput');
      const ingsEl = document.getElementById('quickIngsInput');
      const catEl = document.getElementById('quickCatInput');
      const url = (urlEl.value || '').trim();
      if(!url){ alert('URLを貼り付けてください。'); return; }
      if(!/^https?:\/\//.test(url)){ alert('URLの形式が違います。https://で始まるURLを貼ってください。'); return; }
      // URLからドメイン推測 → レシピ名のヒントに
      let domainHint = '';
      try{
        const u = new URL(url);
        const host = u.hostname.replace(/^www\./, '');
        const map = {
          'sirogohan.com': '白ごはん.com',
          'delishkitchen.tv': 'DELISH KITCHEN',
          'kurashiru.com': 'クラシル',
          'cookpad.com': 'クックパッド',
          'recipe.rakuten.co.jp': '楽天レシピ',
          'orangepage.net': 'オレンジページ',
          'kyounoryouri.jp': 'みんなのきょうの料理',
          'macaro-ni.jp': 'macaroni',
          'erecipe.woman.excite.co.jp': 'Eレシピ',
          'oceans-nadia.com': 'Nadia'
        };
        domainHint = map[host] || host;
      }catch(e){
        alert('URLの形式が変です。'); return;
      }
      const inputName = (nameEl.value || '').trim();
      const ingsRaw = (ingsEl.value || '').trim();
      const ings = ingsRaw ? ingsRaw.split(/[、,，]/).map(s => s.trim()).filter(Boolean) : [];
      let cat = catEl.value;
      if(!cat){
        // 食材から雑にカテゴリ推測
        const ingStr = ings.join(' ');
        if(/麺|うどん|そば|パスタ|ラーメン/.test(ingStr + ' ' + inputName)) cat = '麺類';
        else if(/ご飯|米|丼|チャーハン/.test(ingStr + ' ' + inputName)) cat = '丼・ご飯';
        else if(/汁|スープ|味噌汁/.test(inputName)) cat = '汁物';
        else if(/サラダ/.test(inputName)) cat = 'サラダ';
        else if(/煮|シチュー/.test(inputName)) cat = '煮物';
        else if(/揚|フライ|唐揚|天ぷら/.test(inputName)) cat = '揚げ物';
        else if(/焼|グリル|ソテー|ハンバーグ|ムニエル/.test(inputName)) cat = '焼き物';
        else if(/炒/.test(inputName)) cat = '炒め物';
        else cat = 'その他';
      }
      // レシピ名の自動生成: 食材+カテゴリ > 食材のみ > ドメイン名
      let name = inputName;
      if(!name){
        const mainIng = ings[0]; // 最初の食材をメインに
        if(mainIng && cat && cat !== 'その他'){
          name = `${mainIng}の${cat}`;
        }else if(mainIng){
          name = `${mainIng}のレシピ`;
        }else{
          name = `${domainHint}のレシピ`;
        }
      }
      const id = 'qa_' + Date.now().toString(36);
      const item = {
        id,
        name,
        category: cat,
        mainType: '',
        ingredients: ings,
        required: ings,
        optional: [],
        tags: ['参考URLあり', domainHint],
        time: 20,
        difficulty: 'かんたん',
        childMode: 'separate',
        spicy: false,
        light: '普通',
        steps: ['詳しい作り方は参考URLで確認する。'],
        memo: `${domainHint}から取り込み。気に入ったら鉄板に。`,
        sourceUrl: url,
        sourceKind: 'url',
        custom: true,
        teppan: false,
        createdAt: new Date().toISOString()
      };
      normalizeRecipeForFeatures(item);
      data.recipes.unshift(item);
      saveData();
      // フォームをリセット
      urlEl.value = '';
      nameEl.value = '';
      ingsEl.value = '';
      catEl.value = '';
      render();
      alert(`「${name}」を追加しました。レシピタブで開いて、必要なら食材・カテゴリを編集してください。`);
    }

    // ========== AIヘルパー(食材未入力レシピの一括補完) ==========
    function bulkAddUrls(){
      const el = document.getElementById('bulkUrlInput');
      const raw = (el?.value || '').trim();
      if(!raw){ alert('URLを貼り付けてください。'); return; }
      const urls = raw.split(/\r?\n/).map(s => s.trim()).filter(s => /^https?:\/\//.test(s));
      if(!urls.length){ alert('有効なURLが見つかりません。'); return; }
      const existingUrls = new Set(data.recipes.map(r => String(r.sourceUrl || '').trim()).filter(Boolean));
      const additions = [];
      const skipped = [];
      const domainMap = {
        'sirogohan.com': '白ごはん.com',
        'delishkitchen.tv': 'DELISH KITCHEN',
        'kurashiru.com': 'クラシル',
        'cookpad.com': 'クックパッド',
        'recipe.rakuten.co.jp': '楽天レシピ',
        'kyounoryouri.jp': 'みんなのきょうの料理',
        'oceans-nadia.com': 'Nadia'
      };
      urls.forEach(url => {
        if(existingUrls.has(url)){ skipped.push(url); return; }
        existingUrls.add(url);
        let domainHint = 'レシピ';
        try{
          const u = new URL(url);
          const host = u.hostname.replace(/^www\./, '');
          domainHint = domainMap[host] || host;
        }catch(e){
          skipped.push(url); return;
        }
        const id = 'bulk_' + Math.random().toString(36).slice(2,10);
        additions.push({
          id,
          name: `${domainHint}のレシピ(要補完)`,
          category: 'その他',
          mainType: '',
          ingredients: [],
          required: [],
          optional: [],
          tags: ['参考URLあり', '要補完', domainHint],
          time: 20,
          difficulty: 'かんたん',
          childMode: 'separate',
          spicy: false,
          light: '普通',
          steps: ['詳しい作り方は参考URLで確認する。'],
          memo: `${domainHint}から取り込み(要補完)。AIヘルパーで食材・カテゴリを補完してください。`,
          sourceUrl: url,
          sourceKind: 'url',
          custom: true,
          teppan: false,
          createdAt: new Date().toISOString()
        });
      });
      if(additions.length){
        additions.forEach(normalizeRecipeForFeatures);
        data.recipes = additions.concat(data.recipes);
        saveData();
      }
      el.value = '';
      // 登録できたらAI補完タブに自動移動(誘導)
      if(additions.length > 0){
        state.addRecipeTab = 'ai';
      }
      render();
      let msg = `${additions.length}件のレシピを追加しました。`;
      if(skipped.length) msg += `\n${skipped.length}件は重複または無効URLでスキップ。`;
      if(additions.length > 0) msg += `\n\n👉 続けて「🤖 AI補完」タブから食材・カテゴリを一括補完できます。`;
      alert(msg);
    }

    function applyAiResult(){
      const el = document.getElementById('aiResultInput');
      const raw = (el?.value || '').trim();
      if(!raw){ alert('AIから返ってきたJSONを貼り付けてください。'); return; }
      // JSONブロックの中身だけ抽出(```json...```で囲まれていることが多い)
      let jsonStr = raw;
      const m = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
      if(m) jsonStr = m[1];
      let arr;
      try{
        arr = JSON.parse(jsonStr);
      }catch(e){
        alert('JSONの形式が正しくありません。AIの返答からJSON部分だけを貼り付けてください。\n\nエラー: ' + e.message);
        return;
      }
      if(!Array.isArray(arr)){ alert('JSON配列形式ではありません。'); return; }
      let updated = 0;
      let notFound = [];
      arr.forEach(item => {
        if(!item.id) return;
        const r = data.recipes.find(x => x.id === item.id);
        if(!r){ notFound.push(item.id); return; }
        if(item.name) r.name = item.name;
        if(Array.isArray(item.ingredients) && item.ingredients.length){
          r.ingredients = item.ingredients;
          r.required = item.ingredients;
        }
        if(item.category) r.category = item.category;
        if(typeof item.time === 'number') r.time = item.time;
        if(typeof item.spicy === 'boolean') r.spicy = item.spicy;
        if(item.childMode && ['ok','adapt','separate'].includes(item.childMode)) r.childMode = item.childMode;
        const hasAiFeatureTags = Array.isArray(item.featureTags) || Array.isArray(item.tags);
        const aiFeatureTags = normalizeRecipeTags([
          ...(Array.isArray(item.featureTags) ? item.featureTags : []),
          ...(Array.isArray(item.tags) ? item.tags : []) // 旧形式との互換用
        ]).filter(t => FEATURE_TAGS.includes(t));
        const baseTags = normalizeRecipeTags(r.tags || []).filter(t => !FEATURE_TAGS.includes(t) && t !== '要補完');
        r.tags = uniqueList(baseTags.concat(aiFeatureTags).concat(['AI補完済み']));
        r.featureTagsManual = hasAiFeatureTags;
        normalizeRecipeForFeatures(r);
        r.modified = true;
        r.modifiedAt = new Date().toISOString();
        updated++;
      });
      saveData();
      el.value = '';
      render();
      let msg = `${updated}件のレシピを更新しました!`;
      if(notFound.length) msg += `\n見つからなかったID: ${notFound.length}件`;
      alert(msg);
    }

    function sortRecipeList(list){
      const priorityMode = state.recipePriority || 'none';
      const sortMode = state.recipeSort || 'addedDesc';
      const arr = [...list];
      const originalIndex = new Map(arr.map((r, i) => [String(r.id || i), i]));
      const last = r => lastCookedDate(r.id) || '';
      const byName = (a,b) => String(a.name || '').localeCompare(String(b.name || ''), 'ja');
      const byOriginal = (a,b) => (originalIndex.get(String(a.id || '')) ?? 999999) - (originalIndex.get(String(b.id || '')) ?? 999999);

      let prefVec = null;
      if(sortMode === 'similar'){
        prefVec = computePreferenceVector();
      }

      const priorityRank = r => {
        if(priorityMode === 'teppan') return r.teppan ? 0 : 1;
        if(priorityMode === 'url') return recipeHasSource(r) ? 0 : 1;
        if(priorityMode === 'custom') return (r.custom || r.modified) ? 0 : 1;
        return 0;
      };

      const byAddedDesc = (a,b) => {
        const diff = recipeAddedTime(b) - recipeAddedTime(a);
        return diff || byOriginal(a,b);
      };

      const compareBySort = (a,b) => {
        if(sortMode === 'addedDesc') return byAddedDesc(a,b) || byName(a,b);
        if(sortMode === 'recent') return (last(b)).localeCompare(last(a)) || byName(a,b);
        if(sortMode === 'time') return (Number(a.time)||999) - (Number(b.time)||999) || byName(a,b);
        if(sortMode === 'category') return String(a.category||'').localeCompare(String(b.category||''), 'ja') || byName(a,b);
        if(sortMode === 'similar'){
          const sa = recipeSimilarityScore(a, prefVec);
          const sb = recipeSimilarityScore(b, prefVec);
          return sb - sa || byName(a,b);
        }
        if(sortMode === 'name') return byName(a,b);
        return byAddedDesc(a,b) || byName(a,b);
      };

      arr.sort((a,b) => {
        const priorityDiff = priorityRank(a) - priorityRank(b);
        if(priorityDiff !== 0) return priorityDiff;
        return compareBySort(a,b);
      });
      return arr;
    }

    function recipeAddedTime(r){
      if(!r) return 0;
      const candidates = [r.addedAt, r.createdAt, r.registeredAt];
      for(const value of candidates){
        const t = Date.parse(value || '');
        if(Number.isFinite(t)) return t;
      }
      const id = String(r.id || '');
      const customMatch = id.match(/^c(\d+)$/);
      if(customMatch) return Number(customMatch[1]) || 0;
      const quickMatch = id.match(/^qa_([0-9a-z]+)$/i);
      if(quickMatch){
        const t = parseInt(quickMatch[1], 36);
        if(Number.isFinite(t)) return t;
      }
      return 0;
    }

    function addRecipe(e){
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = fd.get('name').trim();
      const ingredients = parseList(fd.get('ingredients'));
      const required = deriveShoppingIngredients(ingredients);
      let tags = normalizeRecipeTags(parseList(fd.get('tags')).filter(t => t !== 'アイデア候補'));
      const sourceUrl = (fd.get('sourceUrl') || '').trim();
      const spicy = tags.some(t => t.includes('辛'));
      if(spicy && !tags.includes('辛い')) tags.push('辛い');
      const childMode = childModeFromTags(tags);
      const r = {
        id:'c' + Date.now(),
        name,
        category: fd.get('category').trim() || '自作',
        mainType: inferMainType({name, category: fd.get('category').trim() || '自作', ingredients, required}),
        ingredients,
        required,
        optional: [],
        tags,
        time: Number(fd.get('time')) || 20,
        difficulty: 'かんたん',
        childMode,
        spicy,
        light: '普通',
        steps: parseLines(fd.get('steps')),
        memo: fd.get('memo').trim(),
        sourceName: '',
        sourceUrl,
        sourceKind: sourceUrl ? 'url' : 'custom',
        custom: true,
        teppan: true,
        featureTagsManual: tags.some(t => FEATURE_TAGS.includes(t)),
        createdAt: new Date().toISOString()
      };
      normalizeRecipeForFeatures(r);
      data.recipes.unshift(r);
      saveData();
      e.target.reset();
      render();
      openRecipe(r.id);
    }

    function updateRecipe(e, id){
      e.preventDefault();
      const r = recipeById(id);
      if(!r) return;
      const fd = new FormData(e.target);
      const name = fd.get('name').trim();
      const ingredients = parseList(fd.get('ingredients'));
      const required = deriveShoppingIngredients(ingredients);
      let tags = normalizeRecipeTags(parseList(fd.get('tags')).filter(t => t !== 'アイデア候補'));
      const sourceUrl = (fd.get('sourceUrl') || '').trim();
      const spicy = tags.some(t => t.includes('辛'));
      if(spicy && !tags.includes('辛い')) tags.push('辛い');
      r.name = name;
      r.category = fd.get('category').trim() || 'その他・自作';
      r.ingredients = ingredients;
      r.required = required;
      r.tags = tags;
      r.mainType = inferMainType({name, category:r.category, ingredients, required:r.required});
      r.time = Number(fd.get('time')) || 20;
      r.childMode = childModeFromTags(tags);
      r.spicy = spicy;
      r.steps = parseLines(fd.get('steps'));
      r.memo = fd.get('memo').trim();
      r.sourceName = '';
      r.sourceUrl = sourceUrl;
      r.sourceKind = sourceUrl ? 'url' : 'custom';
      r.stock = false;
      r.featureTagsManual = true;
      r.modified = true;

      normalizeRecipeForFeatures(r);
      saveData();
      render();
      openRecipe(id);
    }

    function historyCalendarHtml(ym){
      const [y,m] = ym.split('-').map(Number);
      const first = new Date(y, m - 1, 1);
      const lastDay = new Date(y, m, 0).getDate();
      const start = first.getDay();
      const cells = [];
      for(let i=0;i<start;i++) cells.push('<div class="calendar-day empty-day"></div>');
      for(let day=1; day<=lastDay; day++){
        const date = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const items = data.history.filter(h => h.date === date);
        const isToday = date === todayKey();
        cells.push(`
          <div class="calendar-day ${isToday ? 'today' : ''}">
            <div class="calendar-num">${day}</div>
            ${items.slice(0,2).map(h => `<span class="calendar-dish">${h.photoDataUrl ? '📷 ' : ''}${escHtml(h.name)}</span>`).join('')}
            ${items.length > 2 ? `<span class="calendar-dish">+${items.length-2}件</span>` : ''}

      }
      return `
        <div class="calendar-head"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
