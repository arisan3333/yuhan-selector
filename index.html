              ${likes.length ? likes.map(item => `<span class="tag good with-x">${item}<button class="mini-btn" onclick="removeFamilyTag('${memberId}','likes','${escAttr(item)}')">×</button></span>`).join('') : '<span class="small" style="color:var(--muted)">未選択</span>'}
            </div>
          </div>

          <details class="member-add">
            <summary><b>+ 追加する</b></summary>
            <div class="member-mode">
              ${['hardNg','dislikes','likes'].map(kind => `
                <button class="member-mode-btn" data-active="${state.familyAddKind===kind && state.familyAddMember===memberId?'1':''}" onclick="setFamilyAddMode('${memberId}','${kind}')">${kind==='hardNg'?'❌ 完全NGに':kind==='dislikes'?'😖 苦手に':'😊 好きに'}</button>
              `).join('')}
            </div>
            <div class="small" style="margin:8px 0 4px;color:var(--muted)">候補から選ぶ:</div>
            ${Object.entries(FAMILY_PRESET_INGREDIENTS).map(([group, items]) => {
              const showItems = items.filter(x => !allChosen.has(x));
              if(!showItems.length) return '';
              return `
                <div class="member-preset-group">
                  <div class="small" style="color:var(--muted);margin:6px 0 4px">${group}</div>
                  <div class="chips">
                    ${showItems.map(item => `<button class="chip mini" onclick="addFamilyTag('${memberId}','${escAttr(item)}')">+ ${item}</button>`).join('')}
                  </div>
                </div>
              `;
            }).join('')}
            <div class="row" style="margin-top:10px">
              <input id="${memberId}-customAdd" type="text" placeholder="その他を直接入力" style="flex:1" onkeydown="if(event.key==='Enter'){addFamilyTagCustom('${memberId}')}">
              <button class="secondary" onclick="addFamilyTagCustom('${memberId}')">追加</button>
            </div>
          </details>
        </div>
      `;
    }

    function setFamilyAddMode(memberId, kind){
      state.familyAddMember = memberId;
      state.familyAddKind = kind;
      render();
    }

    function addFamilyTag(memberId, item){
      const m = data.family.members.find(x => x.id === memberId);
      if(!m) return;
      const kind = (state.familyAddMember === memberId && state.familyAddKind) || 'hardNg';
      const list = parseList(m[kind] || '');
      if(list.includes(item)) return;
      list.push(item);
      m[kind] = list.join(', ');
      // 同時に他のリストから除去(同じ項目が複数所属しないように)
      ['hardNg','dislikes','likes'].forEach(other => {
        if(other === kind) return;
        const otherList = parseList(m[other] || '').filter(x => x !== item);
        m[other] = otherList.join(', ');
      });
      saveData();
      render();
    }

    function addFamilyTagCustom(memberId){
      const el = document.getElementById(`${memberId}-customAdd`);
      const v = (el?.value || '').trim();
      if(!v) return;
      addFamilyTag(memberId, v);
    }

    function removeFamilyTag(memberId, kind, item){
      const m = data.family.members.find(x => x.id === memberId);
      if(!m) return;
      const list = parseList(m[kind] || '').filter(x => x !== item);
      m[kind] = list.join(', ');
      saveData();
      render();
    }

    function renameMember(memberId){
      const m = data.family.members.find(x => x.id === memberId);
      if(!m) return;
      const v = prompt('表示名を入力', m.name);
      if(v && v.trim()){
        m.name = v.trim();
        saveData();
        render();
      }
    }

    function saveMembersFromInputs(){
      // 旧UI互換用に残す(新UIはタグ追加時に即保存される)
      data.family.members.forEach(m => {
        const ngEl = document.getElementById(`${m.id}-hardNg`);
        const dlEl = document.getElementById(`${m.id}-dislikes`);
        const lkEl = document.getElementById(`${m.id}-likes`);
        if(ngEl) m.hardNg = ngEl.value.trim();
        if(dlEl) m.dislikes = dlEl.value.trim();
        if(lkEl) m.likes = lkEl.value.trim();
      });
      saveData();
      alert('保存しました');
      render();
    }

    function viewData(){
      return `
        <section class="section">
          <div class="card">
            <h2>データ管理</h2>
            <div class="notice">スマホのブラウザ内に保存しています。端末変更・ブラウザ変更・キャッシュ削除に備えて、たまにJSONを書き出してください。</div>
            <div class="grid2" style="margin-top:12px">
              <button class="primary" onclick="exportJson()">JSONを書き出す</button>
              <label class="secondary" style="text-align:center">
                JSONを読み込む
                <input type="file" accept="application/json" style="display:none" onchange="importJson(event)">
              </label>
            </div>
          </div>
          <div class="card">
            <h3>リセット</h3>
            <p class="small">自分で追加したレシピ、家族NG、履歴、学習も消えます。バックアップ後に実行してください。</p>
            <button class="danger block" onclick="resetAll()">初期状態に戻す</button>
          </div>
          <div class="card">
            <h3>GitHub Pagesで使う手順</h3>
            <ol class="small">
              <li>このファイル名を <span class="kbd">index.html</span> にする</li>
              <li>GitHubリポジトリにアップロードする</li>
              <li>Settings → Pages → Deploy from branch を有効化する</li>
              <li>発行されたURLをAndroidで開く</li>
              <li>ブラウザの「ホーム画面に追加」を使うとアプリ風に開けます</li>
            </ol>
          </div>
          <div style="text-align:center;color:#b8a892;font-size:11px;margin-top:8px">
            🍽️ 今日なに食べる？ <span class="kbd" style="font-size:10px">v20260510-record</span>
          </div>
        </section>
      `;
    }

    function openRecipe(id){
      const r = recipeById(id);
      if(!r) return;
      document.getElementById('modalTitle').textContent = r.name;
      const missing = missingIngredients(r);
      const used = r.ingredients.filter(x => hasIngredientInList(x, data.pantry));
      document.getElementById('modalBody').innerHTML = `
        <div class="chips">
          <span class="tag">${r.category}</span>
          <span class="tag">${r.time}分</span>
          ${childTagHtml(r.childMode)}
          ${r.spicy ? '<span class="tag hot">辛い</span>' : ''}
          ${qualityBadgesHtml(r)}
        </div>
        ${isIdeaRecipe(r) ? `<div class="idea-notice" style="margin-top:12px"><b>アイデア候補です。</b><br>これは外部レシピを確認して登録したものではありません。作る前にネット検索し、よさそうなページのURLを編集画面で登録してください。</div>` : ''}

        <div class="divider"></div>
        <h3>材料メモ</h3>
        <div>${r.ingredients.join('、')}</div>
        <div style="margin-top:8px"><b>買い足し：</b>${missing.length ? missing.join('、') : 'なし'}</div>
        ${used.length ? `<div><b>あるもの：</b>${used.join('、')}</div>` : ''}

        <div class="divider"></div>
        <h3>作り方メモ</h3>
        ${r.steps && r.steps.length ? `<ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>` : '<p class="small">未登録</p>'}

        ${r.memo ? `<div class="divider"></div><h3>家族メモ</h3><p>${escHtml(r.memo).replace(/\n/g,'<br>')}</p>` : ''}

        <div class="divider"></div>
        <h3>参考URL</h3>
        ${r.sourceUrl ? `<p><a class="secondary block" href="${escAttr(r.sourceUrl)}" target="_blank" rel="noopener">参考レシピを開く</a></p>` : `<p class="small">未登録。まずネット検索で実在レシピを確認し、よさそうなら編集画面でURLを貼ってください。</p><button class="secondary block" onclick="searchRecipeByName('${r.id}')">この料理をネット検索</button>`}

        <div class="divider"></div>
        <div class="grid3">
          <button class="primary" onclick="chooseRecipe('${r.id}'); closeDialog()">これにする</button>
          <button class="secondary" onclick="editRecipe('${r.id}')">編集</button>
          <button class="secondary" onclick="toggleTeppan('${r.id}'); openRecipe('${r.id}')">${r.teppan ? '鉄板解除' : '鉄板にする'}</button>
        </div>
        ${r.custom ? `<button class="danger block" style="margin-top:8px" onclick="deleteRecipe('${r.id}')">この自作レシピを削除</button>` : ''}
      `;
      document.getElementById('recipeDialog').showModal();
    }

    function searchRecipeByName(id){
      const r = recipeById(id);
      if(!r) return;
      const q = `${r.name} レシピ ${r.ingredients.slice(0,3).join(' ')}`;
      window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank', 'noopener');
    }

    function externalSearchLinks(name){
      const q = encodeURIComponent(name);
      const google = encodeURIComponent(name + ' レシピ');
      const links = [
        ['白ごはん.comを検索', `https://www.google.com/search?q=site%3Asirogohan.com+${google}`],
        ['クックパッドで探す', `https://cookpad.com/search/${q}`],
        ['DELISH KITCHENで探す', `https://delishkitchen.tv/search?q=${q}`],
        ['楽天レシピで探す', `https://recipe.rakuten.co.jp/search/${q}/`]
      ];
      return links.map(([label,url]) => `<a class="secondary" href="${url}" target="_blank" rel="noopener">${label}</a>`).join('');
    }

    function closeDialog(){
      document.getElementById('recipeDialog').close();
    }

    function toggleTeppan(id){
      const r = recipeById(id);
      if(!r) return;
      r.teppan = !r.teppan;
      saveData();
      render();
    }

    function deleteRecipe(id){
      const r = recipeById(id);
      if(!r || !r.custom) return;
      if(!confirm(`${r.name}を削除しますか？`)) return;
      data.recipes = data.recipes.filter(x => x.id !== id);
      saveData();
      closeDialog();
      render();
    }

    function addCustomPantry(){
      const input = document.getElementById('customPantryInput');
      const val = input.value.trim();
      if(!val) return;
      const baseSet = baseIngredientSet();
      if(!baseSet.has(val)){
        data.customIngredients = data.customIngredients || [];
        if(!data.customIngredients.includes(val)) data.customIngredients.push(val);
      }
      ensureStockForIngredient(data, val);
      if(!data.pantry.includes(val)) data.pantry.push(val);
      input.value = '';
      saveData();
      render();
    }
    function addCustomBargain(){
      const input = document.getElementById('customBargainInput');
      const val = input.value.trim();
      if(!val) return;
      if(!data.bargain.includes(val)) data.bargain.push(val);
      const baseSet = baseIngredientSet();
      if(!baseSet.has(val)){
        data.customIngredients = data.customIngredients || [];
        if(!data.customIngredients.includes(val)) data.customIngredients.push(val);
      }
      ensureStockForIngredient(data, val);
      input.value = '';
      saveData();
      render();
    }
    function clearPantry(){
      data.pantry = [];
      saveData();
      render();
    }

    function addManualShopping(){
      const input = document.getElementById('manualShoppingInput');
      const val = input.value.trim();
      if(!val) return;
      data.shoppingList.push({name:val, recipeId:null, recipeName:'手動', createdAt:new Date().toISOString()});
      input.value = '';
      saveData();
      render();
    }

    function clearShoppingList(){
      if(!confirm('買い物リストを消しますか？')) return;
      data.shoppingList = [];
      data.shoppingDone = {};
      saveData();
      render();
    }

    async function copyShoppingList(){
      const text = data.shoppingList.map(x => `□ ${x.name}`).join('\n');
      try{
        await navigator.clipboard.writeText(text);
        alert('コピーしました');
      }catch(e){
        alert(text);
      }
    }

    function handleHistoryPhoto(event, at){
      const file = event.target.files && event.target.files[0];
      if(!file) return;
      if(!file.type.startsWith('image/')){
        alert('画像ファイルを選んでください');
        return;
      }
      resizeImageFile(file, 960, 0.82).then(dataUrl => {
        const h = data.history.find(x => x.at === at);
        if(!h) return;
        h.photoDataUrl = dataUrl;
        saveData();
        render();
      }).catch(err => {
        console.error(err);
        alert('写真の読み込みに失敗しました');
      });
    }

    function resizeImageFile(file, maxSize = 960, quality = 0.82){
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            const scale = Math.min(1, maxSize / Math.max(w, h));
            w = Math.max(1, Math.round(w * scale));
            h = Math.max(1, Math.round(h * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function removeHistoryPhoto(at){
      const h = data.history.find(x => x.at === at);
      if(!h) return;
      if(!confirm('この写真を削除しますか？')) return;
      h.photoDataUrl = '';
      saveData();
      render();
    }

    function editHistoryMemo(at){
      const h = data.history.find(x => x.at === at);
      if(!h) return;
      const memo = prompt('この日のメモ', h.memo || '');
      if(memo === null) return;
      h.memo = memo.trim();
      saveData();
      render();
    }

    function exportJson(){
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `menu-selector-backup-${todayKey()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importJson(e){
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const imported = JSON.parse(reader.result);
          if(!imported.recipes || !Array.isArray(imported.recipes)) throw new Error('recipesがありません');
          data = normalizeLoadedData(imported);
          saveData();
          state.currentCandidates = [];
          alert('読み込みました');
          render();
        }catch(err){
          alert('読み込みに失敗しました: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function resetAll(){
      if(!confirm('全データを初期状態に戻しますか？')) return;
      data = defaultData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      state.currentCandidates = [];
      state.excludedToday = new Set();
      state.filtersToday = {};
      render();
    }

    function removeHistory(at){
      data.history = data.history.filter(h => h.at !== at);
      saveData();
      render();
    }

    function recipeById(id){ return data.recipes.find(r => r.id === id); }
    function lastCookedDate(id){
      const h = data.history.find(x => x.recipeId === id);
      return h ? h.date : null;
    }
    function daysSince(dateStr){
      const then = new Date(dateStr + 'T00:00:00');
      const now = new Date(todayKey() + 'T00:00:00');
      return Math.floor((now - then) / 86400000);
    }
    function normalizeIngredientName(s){
      return String(s || '').replace(/\s+/g,'').replace(/肉$/,'');
    }
    function canonicalIngredient(s){
      const n = normalizeIngredientName(s);
      for(const group of INGREDIENT_EQUIV_GROUPS){
        const hit = group.some(alias => {
          const a = normalizeIngredientName(alias);
          return n === a || n.includes(a) || a.includes(n);
        });
        if(hit) return group[0];
      }
      return n;
    }
    function ingredientsMatch(a,b){
      if(a === b) return true;
      return canonicalIngredient(a) === canonicalIngredient(b);
    }
    function hasIngredientInList(ingredient, list){
      return (list || []).some(x => ingredientsMatch(ingredient, x));
    }

    function toggleArrayItem(arr, item){
      const i = arr.indexOf(item);
      if(i >= 0) arr.splice(i,1);
      else arr.push(item);
    }
    function parseList(v){
      return String(v || '').split(/[,\n、]/).map(x=>x.trim()).filter(Boolean);
    }
    function parseLines(v){
      return String(v || '').split(/\n/).map(x=>x.replace(/^\s*\d+[.)、．]?\s*/,'').trim()).filter(Boolean);
    }
    function allTerms(vals){
      return vals.flatMap(v => parseList(v)).filter(Boolean);
    }
    function recipeContains(r, term){
      if(!term) return false;
      const hay = [r.name, r.category, r.mainType, ...r.ingredients, ...r.tags].join(' ');
      return hay.includes(term);
    }
    function childLabel(mode){
      if(mode === 'ok') return '子供OK';
      if(mode === 'adapt') return '子供アレンジ可';
      if(mode === 'separate') return '子供別メニュー前提';
      return '子供対応未設定';
    }
    function childTagHtml(mode){
      if(mode === 'ok') return '<span class="tag good">子供OK</span>';
      if(mode === 'adapt') return '<span class="tag blue">子供アレンジ可</span>';
      if(mode === 'separate') return '<span class="tag bad">子供別</span>';
      return '';
    }
    function esc(s){
      return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
    }
    function escHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escAttr(s){ return escHtml(s).replace(/`/g,'&#96;'); }

    render();
  </script>
</body>
